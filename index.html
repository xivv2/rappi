<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<meta name="description" content="Prototipo conceptual de Rappi Impulsa · Innovathon 2026">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FF441F'/><path d='M8 21l6-6 4 4 7-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Rappi Impulsa · Prototipo</title><style>
*{box-sizing:border-box;margin:0}
:root{--o:#FF441F;--od:#E5391A;--soft:#FFF2EE;--softb:#FFD9CF;--ink:#1D1D1F;--t:#1D1D1F;--g:#6E6E73;--m:#8E8E93;--line:#ECE7E2;--bg:#FAF8F6;--l:#FAF8F6;--stage:#F5F1ED;--r:14px}
html,body{overscroll-behavior:none}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--stage);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit}
button,.chip,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}

/* ---------- SHOWCASE (escritorio) ---------- */
.stage{min-height:100vh;display:grid;grid-template-columns:auto;grid-template-areas:"device";align-items:center;justify-content:center;column-gap:clamp(56px,9vw,150px);padding:32px 40px;position:relative}
.stage::before{display:none;content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);z-index:0}
.intro{grid-area:intro;position:relative;z-index:1;background:var(--stage);padding:24px 0}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--o);margin-bottom:22px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--o);border-radius:2px}
.intro h1{font-size:clamp(44px,4.6vw,62px);line-height:.98;font-weight:800;letter-spacing:-.045em}
.intro h1 span{color:var(--o)}
.intro .lead{font-size:17px;line-height:1.5;color:var(--g);margin:20px 0 28px;max-width:300px}
.pillars{list-style:none;padding:0;margin:0 0 32px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;max-width:300px}
.pillars li{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--ink);display:flex;align-items:center;gap:8px}
.pillars li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--o)}
#qrbox{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;max-width:300px}
#qr{width:104px;height:104px;flex:none;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
#qr svg{width:104px;height:104px}
#qrbox strong{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
#qrbox small{display:block;font-size:11.5px;color:var(--m);line-height:1.4;word-break:break-all}
.foot{margin-top:22px;font-size:11.5px;color:var(--m);font-weight:600;letter-spacing:.02em}

.device{grid-area:device;position:relative;z-index:1}
#side{grid-area:side;position:relative;z-index:1;background:var(--stage);padding:24px 0}
#demo{display:flex;flex-direction:column;counter-reset:d}
#demo h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin-bottom:4px}
#demo small{font-size:12px;color:var(--m);margin-bottom:12px}
#demo button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;transition:color .15s}
#demo button:not(.p)::before{counter-increment:d;content:counter(d,decimal-leading-zero);font-size:11px;font-weight:700;color:#BDB6AF;font-variant-numeric:tabular-nums;width:18px}
#demo button:not(.p):hover{color:var(--o)}
#demo .p{margin-top:16px;justify-content:center;background:var(--o);color:#fff;border:0;border-radius:12px;padding:13px 14px;font-weight:700}
#demo .p:hover{background:var(--od)}

/* ---------- TELÉFONO ---------- */
.phone{width:393px;height:852px;max-height:calc(100vh - 56px);background:#fff;border-radius:56px;border:11px solid #121214;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 0 1px #CFC8C1,0 40px 80px -30px rgba(40,25,15,.35)}
.phone::after{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#121214;z-index:12}
.sbar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-size:15px;font-weight:700;background:#fff}
.sbar .sic{display:flex;gap:6px;align-items:center}
.tag{background:#fff;color:var(--m);font-size:10.5px;font-weight:600;text-align:center;padding:0 0 4px;letter-spacing:.02em}
#appbar{display:flex;align-items:center;gap:10px;padding:8px 20px 12px;background:#fff;border-bottom:1px solid var(--line)}
#appbar .brand{flex:1;font-size:20px;font-weight:800;letter-spacing:-.035em;color:var(--o)}
#onl{border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;background:#E9F7EE;color:#17803D;cursor:pointer;min-height:32px}
#onl.off{background:#F1EFEC;color:var(--g)}
#bell{border:0;background:#F4F1EE;color:var(--ink);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

#scr{flex:1;overflow-y:auto;padding:20px 20px 28px;background:var(--bg);-webkit-overflow-scrolling:touch}
#scr::-webkit-scrollbar{width:0}

/* tipografía */
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.035em}
h2{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.03em;margin:2px 0 12px}
h3{font-size:16px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin:22px 0 8px}
p{font-size:14.5px;line-height:1.5;margin:6px 0;color:#55555B}
strong{font-weight:700;color:var(--ink)}

/* componentes */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0;font-size:14.5px;line-height:1.5;color:#3A3A3E}
.card b{display:block;font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:4px 0 2px}
.card p{margin:4px 0 0}
.card[style*="border:2px solid"]{border:1.5px solid var(--o)!important;background:var(--soft)}
.card[style*="border:2px solid"] b{color:var(--o)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.row>.card{margin:10px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--o);color:#fff;border:0;border-radius:12px;padding:14px 18px;font-size:15.5px;font-weight:700;margin:10px 0;cursor:pointer;min-height:52px;transition:background .15s,transform .1s}
.btn:hover{background:var(--od)}
.btn:active{transform:scale(.985)}
.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line);justify-content:flex-start;text-align:left;font-weight:600}
.btn.s:hover{background:#fff;border-color:#D8D1CA}
.btn.s .ic{color:var(--o);width:20px;height:20px}
#scr .btn.s:not(.row .btn)::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid #B9B2AB;border-bottom:2px solid #B9B2AB;transform:rotate(-45deg);flex:none}
.row .btn.s,#modal .btn.s{justify-content:center;text-align:center}
.row .btn{font-size:14.5px;padding:14px 10px}
.btn:focus-visible,button:focus-visible,[role=button]:focus-visible{outline:3px solid #1B6EF3;outline-offset:2px}

.note{font-size:11.5px;line-height:1.45;color:var(--m);margin:12px 0 4px}
.warn{background:#FFF7E8;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;color:#6A4B00;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;margin:3px 4px 3px 0;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2}
.chip.on{background:var(--soft);color:var(--od);border-color:var(--softb)}
.chip .ic{width:14px;height:14px}
.bar{height:6px;background:#EEE8E2;border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--o);width:0;border-radius:6px}
.vid{background:var(--o);color:#fff;border-radius:16px;padding:18px;min-height:168px;display:flex;flex-direction:column;justify-content:space-between}
.vid strong{color:#fff;font-size:17px;letter-spacing:-.01em;padding-right:78px;display:block}
.vid p{color:#fff;opacity:.92;display:flex;align-items:center;gap:8px;font-weight:600}
.ch{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none}.ch::-webkit-scrollbar{display:none}.ch .chip{white-space:nowrap}
.msg{max-width:84%;padding:11px 14px;border-radius:18px;margin:8px 0;font-size:14.5px;line-height:1.45}
.rt{background:var(--o);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.ld{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.hist{display:flex;gap:10px;align-items:flex-end;height:150px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:#FFD2C6;border-radius:6px 6px 0 0;color:var(--ink);font-size:11px;font-weight:700;text-align:center;padding-top:5px}
.hist div:last-child{background:var(--o);color:#fff}
#modal{position:absolute;inset:0;background:rgba(20,20,22,.42);display:none;align-items:flex-end;z-index:5}
#modal>div{background:#fff;width:100%;max-height:86%;overflow-y:auto;border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom))}
#modal>div::before{content:"";display:block;width:38px;height:4px;border-radius:4px;background:#DDD7D1;margin:0 auto 16px}
#toast{position:absolute;bottom:84px;left:20px;right:20px;background:var(--ink);color:#fff;padding:13px 14px;border-radius:12px;font-size:13.5px;font-weight:600;display:none;z-index:9;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#cap{position:absolute;top:150px;left:16px;right:16px;background:rgba(29,29,31,.92);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;z-index:8;display:none}
.rec{background:var(--o);color:#fff;border-radius:18px;padding:28px 22px;text-align:center}
.rec p{color:#fff;opacity:.95}.rec h2{color:#fff;margin:6px 0 10px}.rec h3{color:#fff;font-size:17px;line-height:1.35;letter-spacing:0;margin:0 0 10px}
.rec strong{color:#fff;letter-spacing:.14em;font-size:12px}
.seal{display:inline-block;border:1.5px solid #fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:12px;margin-top:12px}
.jr{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none}.jr .card{min-width:210px;scroll-snap-align:start}
.jr .card b{color:var(--o)}

/* pantallas específicas (solo estilo) */
#scr [style*="font-size:54px"]{width:92px;height:92px;margin:0 auto 22px;border-radius:26px;background:var(--soft);color:var(--o);display:flex;align-items:center;justify-content:center;font-size:42px!important}
#scr [style*="padding-top:50px"] h1{font-size:38px;margin-bottom:12px}
#scr [style*="padding-top:50px"] h3{font-weight:600;color:var(--ink);font-size:17px;margin:0 0 6px}
#scr [style*="padding-top:40px"] h1,#scr [style*="padding-top:30px"] h1{font-size:32px;margin:18px 0}
#scr [style*="padding-top:40px"] h2,#scr [style*="padding-top:30px"] h2{font-size:13px;letter-spacing:.14em}
#scr [style*="font-size:34px"]{display:flex;gap:6px;margin:6px 0 14px}

nav{display:flex;border-top:1px solid var(--line);background:#fff;flex:none}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:10.5px;font-weight:600;color:var(--m);cursor:pointer;min-height:58px;position:relative}
nav button.on{color:var(--o);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:2.5px;background:var(--o);border-radius:0 0 3px 3px}
nav span{display:block;font-size:22px;line-height:1;margin-bottom:4px}
nav span .ic{width:23px;height:23px}
@keyframes sp{to{transform:rotate(360deg)}}.spin{width:44px;height:44px;border:4px solid var(--softb);border-top-color:var(--o);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
#fab,#scrim{display:none}

/* pantallas medianas */
@media(max-width:1100px) and (min-width:761px){
 .stage{grid-template-columns:260px auto;column-gap:48px}
 .pillars,.foot{display:none}
 .intro h1{font-size:46px}
}

/* ---------- CELULAR ---------- */
@media(max-width:760px){
 body{background:#fff;min-height:0}
 .stage{display:block;padding:0;min-height:0}.stage::before,.intro{display:none}
 .phone{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
 .phone::after,.sbar{display:none}
 .tag{padding-top:calc(6px + env(safe-area-inset-top))}
 nav{padding-bottom:env(safe-area-inset-bottom)}
 #side{padding:0}
 #demo{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:22px 22px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;max-height:80dvh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:0 16px;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -20px 40px -20px rgba(0,0,0,.3)}
 #demo::before{content:"";grid-column:1/-1;width:38px;height:4px;border-radius:4px;background:#DDD7D1;margin:0 auto 14px}
 #demo.open{transform:none}
 #demo h3,#demo small,#demo .p{grid-column:1/-1}
 #demo button{min-height:48px}
 #scrim{position:fixed;inset:0;background:rgba(20,20,22,.42);z-index:25}#scrim.on{display:block}
 #fab{display:flex;align-items:center;gap:8px;position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:20;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.45);cursor:pointer;min-height:44px}
 #toast{bottom:calc(128px + env(safe-area-inset-bottom))}
 #cap{top:calc(96px + env(safe-area-inset-top))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- MOVIMIENTO Y ESTADOS ---------- */
#demo{display:none!important}
#back{display:none;border:0;background:none;width:34px;height:38px;margin-left:-10px;color:var(--ink);cursor:pointer;align-items:center;justify-content:center;font-size:24px;border-radius:10px}
#back.on{display:flex}#back:active{background:#F4F1EE}
.tour{display:inline-flex;align-items:center;gap:12px;margin-top:22px;background:none;border:0;padding:0;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.tour i{width:38px;height:38px;border-radius:50%;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;animation:pulse 2.4s infinite}
.tour:hover{color:var(--o)}
#splash{position:absolute;inset:0;z-index:40;background:var(--o);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:0 40px;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.05);pointer-events:none}
#splash .mk{width:86px;height:86px;border-radius:26px;background:#fff;color:var(--o);display:flex;align-items:center;justify-content:center;font-size:42px;animation:popin .6s cubic-bezier(.2,1.4,.4,1) both}
#splash .mk .ic{animation:ride 1s ease-in-out infinite}
#splash b{font-size:30px;font-weight:800;letter-spacing:-.035em;margin-top:20px;animation:up .5s .25s both}
#splash small{font-size:13.5px;line-height:1.45;font-weight:600;opacity:.9;margin-top:8px;max-width:240px;animation:up .5s .4s both}
#splash .ld{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:30px;overflow:hidden}
#splash .ld i{display:block;height:100%;background:#fff;transform-origin:left;animation:grow 1.4s ease-in-out both}

@keyframes inR{from{opacity:0;transform:translateX(32px)}}
@keyframes inL{from{opacity:0;transform:translateX(-32px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes popin{from{opacity:0;transform:scale(.55)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,68,31,.45)}70%{box-shadow:0 0 0 12px rgba(255,68,31,0)}100%{box-shadow:0 0 0 0 rgba(255,68,31,0)}}
@keyframes pulseG{0%{box-shadow:0 0 0 0 rgba(23,179,74,.5)}70%{box-shadow:0 0 0 8px rgba(23,179,74,0)}100%{box-shadow:0 0 0 0 rgba(23,179,74,0)}}
@keyframes ride{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes road{to{background-position:-16px 0}}
@keyframes ring{from{transform:scale(.8);opacity:.8}to{transform:scale(2.3);opacity:0}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-4px);opacity:1}}
@keyframes fall{to{transform:translate(var(--x),720px) rotate(var(--r));opacity:0}}
@keyframes tab{0%{transform:scale(1)}40%{transform:scale(1.2) translateY(-2px)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes drawck{from{stroke-dashoffset:40}}

.view.enter.r{animation:inR .34s cubic-bezier(.2,.8,.2,1) both}
.view.enter.l{animation:inL .34s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*,.view.enter>[style*="text-align:center"]>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.view.enter>:nth-child(2),.view.enter>[style*="text-align:center"]>:nth-child(2){animation-delay:.05s}
.view.enter>:nth-child(3),.view.enter>[style*="text-align:center"]>:nth-child(3){animation-delay:.1s}
.view.enter>:nth-child(4),.view.enter>[style*="text-align:center"]>:nth-child(4){animation-delay:.15s}
.view.enter>:nth-child(5),.view.enter>[style*="text-align:center"]>:nth-child(5){animation-delay:.2s}
.view.enter>:nth-child(6),.view.enter>[style*="text-align:center"]>:nth-child(6){animation-delay:.25s}
.view.enter>:nth-child(7){animation-delay:.3s}.view.enter>:nth-child(8){animation-delay:.34s}
.view.enter>:nth-child(n+9){animation-delay:.38s}
.view.enter>[style*="text-align:center"]{animation:none}

.card[role=button]{cursor:pointer;transition:transform .15s,border-color .15s}
.card[role=button]:active{transform:scale(.98)}
.card[role=button]:hover{border-color:#D8D1CA}
.chip{transition:background .15s,color .15s,border-color .15s,transform .1s}.chip:active{transform:scale(.95)}
nav button{transition:color .2s}nav button:active span{transform:scale(.9)}
nav button.bounce span{animation:tab .4s ease}
#modal{animation:fade .2s ease}
#modal>div{animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
#modal .hist div{transform-origin:bottom;animation:growY .7s cubic-bezier(.2,.8,.2,1) both}
#modal .hist div:nth-child(2){animation-delay:.06s}#modal .hist div:nth-child(3){animation-delay:.12s}#modal .hist div:nth-child(4){animation-delay:.18s}#modal .hist div:nth-child(5){animation-delay:.24s}
#toast{animation:up .25s ease}
.bar i:not(#vb){transform-origin:left;animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}
#vb{transition:width .25s linear}

/* bienvenida: scooter en movimiento */
#scr [style*="font-size:54px"]{position:relative;overflow:hidden;padding-bottom:10px}
#scr [style*="font-size:54px"] .ic{animation:ride 1s ease-in-out infinite}
#scr [style*="font-size:54px"]::after{content:"";position:absolute;left:16px;right:16px;bottom:18px;height:2px;background:repeating-linear-gradient(90deg,var(--o) 0 8px,transparent 8px 16px);background-size:16px 2px;opacity:.45;animation:road .5s linear infinite}

/* video */
.vid{position:relative;overflow:hidden}
.vid .big{position:absolute;right:18px;top:18px;width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:30px;animation:popin .4s cubic-bezier(.2,1.4,.4,1) both}
.vid.playing .big .ic{animation:ride 1.1s ease-in-out infinite}
.btn.pulse{animation:pulse 1.8s infinite}

/* pedido en vivo */
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#17B34A;margin-right:8px;vertical-align:1px;animation:pulseG 1.6s infinite}

/* inicio: etapas */
.stg-done{background:var(--soft)!important;border-color:var(--softb)!important}
.stg-done strong{color:var(--od)}
.stg-now{border:1.5px solid var(--o)!important;animation:pulse 2.4s infinite}
.stg-lock{opacity:.5}

/* buscando líder */
.spin{width:78px;height:78px;border:0;border-radius:50%;background:var(--o);position:relative;animation:none;margin:30px auto 26px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.spin::before,.spin::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--o);animation:ring 1.8s ease-out infinite}
.spin::after{animation-delay:.9s}
.spin .ic{animation:ride .9s ease-in-out infinite}

/* chat */
.msg.new{animation:up .32s cubic-bezier(.2,.8,.2,1) both}
.dots{display:inline-flex;gap:4px;margin-right:8px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--m);animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

/* quiz */
.btn.ok{background:#E9F7EE!important;border-color:#17B34A!important;color:#0F6B2F!important}
.btn.bad{background:#FFF0EE!important;border-color:var(--o)!important;color:var(--od)!important;animation:shake .35s}
.btn:disabled{cursor:default}
.donecheck{width:88px;height:88px;border-radius:50%;background:var(--o);color:#fff;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}
.donecheck path{stroke-dasharray:40;animation:drawck .5s .3s ease-out both}

/* valoración */
#scr [style*="color:#f5a300"]{display:inline-block;animation:popin .3s cubic-bezier(.2,1.4,.4,1) both}

/* reconocimiento */
.cf{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;z-index:30;pointer-events:none;animation:fall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
.view.enter .rec{animation:popin .5s cubic-bezier(.2,1.2,.4,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 function countUp(v){if(RM)return;v.querySelectorAll('.card b').forEach(b=>{const n=b.firstChild;if(!n||n.nodeType!==3)return;
